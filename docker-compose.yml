version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: mymaco_user
      POSTGRES_PASSWORD: mymaco_password
      POSTGRES_DB: mymaco_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymaco_user -d mymaco_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MyMaCo Main Image
  mymaco-main:
    image: mymaco/mymaco:latest # TODO: Replace with your actual image name
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYMACO_DB_HOST: db
      MYMACO_DB_PORT: 5432
      MYMACO_DB_DATABASE: mymaco_db
      MYMACO_DB_USER: mymaco_user
      MYMACO_DB_PASSWORD: mymaco_password
      MYMACO_ENCRYPTION_KEY: mymaco_encryptionkey

  # MyMaCo Sync Image
  mymaco-sync:
    image: mymaco/mymaco-sync:latest # TODO: Replace with your actual image name
    restart: unless-stopped
    depends_on:
      - mymaco-main
    environment:
      MYMACO_DB_HOST: db
      MYMACO_DB_PORT: 5432
      MYMACO_DB_DATABASE: mymaco_db
      MYMACO_DB_USER: mymaco_user
      MYMACO_DB_PASSWORD: mymaco_password
      MYMACO_ENCRYPTION_KEY: mymaco_encryptionkey
      # Optional: Uncomment and set to sync a specific n8n environment
      # MYMACO_WORKER_ENV: "GUID"

volumes:
  db_data:
